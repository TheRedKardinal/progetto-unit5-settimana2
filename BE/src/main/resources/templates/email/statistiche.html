<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Le tue statistiche</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 24px;">
    <table role="presentation" width="100%" style="max-width: 480px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden;">
        <tr>
            <td style="background-color: #2563eb; padding: 20px 24px;">
                <h1 style="color: #ffffff; font-size: 20px; margin: 0;">Ciao <span th:text="${username}">utente</span> 👋</h1>
            </td>
        </tr>
        <tr>
            <td style="padding: 24px;">
                <p style="color: #333333; font-size: 15px;">Ecco un riepilogo della tua attività di messaggistica:</p>

                <table role="presentation" width="100%" style="margin-top: 16px;">
                    <tr>
                        <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee; color: #555555;">Messaggi inviati</td>
                        <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee; text-align: right; font-weight: bold; color: #111111;" th:text="${messaggiInviati}">0</td>
                    </tr>
                    <tr>
                        <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee; color: #555555;">Messaggi ricevuti</td>
                        <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee; text-align: right; font-weight: bold; color: #111111;" th:text="${messaggiRicevuti}">0</td>
                    </tr>
                    <tr>
                        <td style="padding: 10px 0; color: #555555;">Chat attive</td>
                        <td style="padding: 10px 0; text-align: right; font-weight: bold; color: #111111;" th:text="${numeroChat}">0</td>
                    </tr>
                </table>

                <p style="color: #999999; font-size: 12px; margin-top: 24px;">Email generata automaticamente, non rispondere a questo messaggio.</p>
            </td>
        </tr>
    </table>
</body>
</html>
